id: bayesian-modeling-070
release: 0.7.0
datasets:
  - gold_bayesian_linear
seed: 260917
learning_objectives:
  - distinguish prior, likelihood, posterior and posterior predictive uncertainty
  - fit the package-native conjugate Gaussian reference model
  - use brms only through an explicit optional backend contract
  - report approximation method when inference is not full MCMC
required_assertions:
  - posterior_recovery_uses_generator_truth_only_for_validation
  - approximation_is_recorded_explicitly
  - posterior_predictive_is_not_relabelled_as_conformal
required_outputs:
  - posterior_summary
  - posterior_predictive_distribution
  - provenance_record
expected_warnings: []
