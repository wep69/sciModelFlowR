id: bayesian-diagnostics-and-predictive-checking-070
release: 0.7.0
datasets:
  - gold_bayesian_linear
seed: 260917
learning_objectives:
  - diagnose R-hat, effective sample size and divergences
  - perform posterior predictive checks before scientific interpretation
  - use PSIS-LOO and stacking without turning them into automatic truth selectors
required_assertions:
  - pathological_mcmc_diagnostics_create_structured_warnings
  - divergences_can_be_blocking
  - predictive_comparison_preserves_model_uncertainty
required_outputs:
  - diagnostic_flags
  - posterior_predictive_check
  - loo_or_stacking_summary
expected_warnings:
  - MCMC_RHAT_HIGH
  - MCMC_ESS_LOW
  - MCMC_DIVERGENCES
