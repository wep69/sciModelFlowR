id: probabilistic-machine-learning-030
release: 0.3.0
datasets:
  - gold_binary_calibration
  - gold_heteroscedastic_regression
seed: 260915
learning_objectives:
  - distinguish point predictions from probability distributions
  - evaluate probabilistic predictions with proper scoring rules
  - request only distribution operations supported by the representation
required_assertions:
  - probability_rows_sum_to_one
  - unsupported_density_operation_is_blocked
  - calibration_report_uses_held_out_labels
required_outputs:
  - prediction_distribution
  - probabilistic_score_table
  - calibration_report
expected_warnings: []
