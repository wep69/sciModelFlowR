id: supervised-machine-learning-030
release: 0.3.0
datasets:
  - gold_linear_regression
  - gold_multiclass_imbalanced
seed: 260915
learning_objectives:
  - fit supervised models through package-native adapters
  - compare adapter predictions with direct backend predictions
  - preserve design and preprocessing boundaries across model engines
required_assertions:
  - adapter_predictions_match_reference_backend
  - probability_rows_sum_to_one
  - unsupported_backend_capability_fails_explicitly
required_outputs:
  - supervised_fit_result
  - prediction_result
  - adapter_capability_table
expected_warnings: []
