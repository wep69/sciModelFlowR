id: imbalance-calibration-thresholds-030
release: 0.3.0
datasets:
  - gold_multiclass_imbalanced
  - gold_binary_calibration
seed: 260915
learning_objectives:
  - apply sampling or weights only inside analysis data
  - calibrate probabilities without touching final test labels
  - separate threshold selection from final performance evaluation
required_assertions:
  - assessment_sampling_is_blocked
  - calibration_and_final_test_ids_are_disjoint
  - calibrated_probabilities_are_normalized
  - threshold_selection_does_not_use_final_test_labels
required_outputs:
  - imbalance_result
  - calibration_result
  - threshold_result
  - final_metric_table
expected_warnings:
  - imbalance_warning_when_class_support_is_small
