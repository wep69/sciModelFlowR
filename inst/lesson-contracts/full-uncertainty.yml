id: full-uncertainty-070
release: 0.7.0
datasets:
  - gold_bayesian_linear
  - gold_conformal_regression
seed: 260918
learning_objectives:
  - distinguish confidence, credible, posterior predictive, bootstrap and conformal intervals
  - decompose aleatoric and epistemic uncertainty only when identifiable
  - compare interval semantics before comparing interval widths
  - combine Bayesian prediction and conformal calibration without merging their probability statements
required_assertions:
  - uncertainty_types_remain_noninterchangeable
  - decomposition_requires_identifiability
  - conformal_and_credible_labels_remain_distinct
required_outputs:
  - uncertainty_descriptors
  - decomposition_result
  - integrated_bayesian_conformal_workflow
expected_warnings: []
