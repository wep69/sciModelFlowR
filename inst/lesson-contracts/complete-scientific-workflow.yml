id: complete-scientific-workflow-040
release: 0.4.0
datasets:
  - gold_multiclass_imbalanced
seed: 260915
learning_objectives:
  - connect design audit resampling preprocessing supervised modeling tuning benchmarking and provenance
  - protect final evidence from model-development decisions
  - report model-selection and external-evaluation quantities separately
required_assertions:
  - preprocessing_is_training_only
  - imbalance_is_training_only
  - calibration_excludes_final_test_labels
  - tuning_excludes_final_test_labels
  - benchmark_candidates_share_resampling_hash
required_outputs:
  - experiment_spec
  - split_manifest
  - tuning_result
  - benchmark_result
  - reproducibility_manifest
expected_warnings: []
