id: feature-engineering-selection-020
release: 0.2.0
datasets:
  - gold_grouped_fields
seed: 260915
learning_objectives:
  - fit learned feature operations on training data only
  - quantify selection stability across folds
  - distinguish selection from representation learning
required_assertions:
  - supervised_global_selection_blocked
  - selector_uses_training_rows_only
  - selected_columns_exist
required_outputs:
  - fold_selection_results
  - feature_stability_table
expected_warnings: []
