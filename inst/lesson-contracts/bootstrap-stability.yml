id: bootstrap-stability-020
release: 0.2.0
datasets:
  - gold_grouped_fields
  - gold_time_climate
seed: 260915
learning_objectives:
  - choose bootstrap unit from dependence structure
  - distinguish IID and dependence-aware bootstrap
  - inspect replicate failures and interval stability
required_assertions:
  - iid_bootstrap_blocked_for_grouped_design
  - cluster_bootstrap_preserves_group_unit
  - temporal_block_bootstrap_requires_order
required_outputs:
  - bootstrap_result
  - interval_table
  - stability_table
expected_warnings:
  - bootstrap_design_mismatch_when_intentionally_demonstrated
