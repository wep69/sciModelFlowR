id: conformal-prediction-070
release: 0.7.0
datasets:
  - gold_conformal_regression
seed: 260918
learning_objectives:
  - separate training, calibration and untouched final test roles
  - construct split conformal and CV+ intervals
  - construct deterministic APS classification sets
  - state exchangeability assumptions with every coverage claim
required_assertions:
  - calibration_and_final_test_ids_do_not_overlap
  - final_test_is_never_used_to_calibrate_intervals
  - interval_type_is_conformal
  - observed_coverage_is_checked_on_untouched_test_data
required_outputs:
  - conformal_result
  - empirical_coverage_summary
  - structured_exchangeability_warnings
expected_warnings:
  - CONFORMAL_EXCHANGEABILITY_MISMATCH
